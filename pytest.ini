[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths = tests
pythonpath = .
markers =
    smoke: Quick sanity smoke tests (< 5 seconds execution)
    slow: Comprehensive or compute-heavy training tests
    gpu: Tests requiring CUDA-capable GPU
filterwarnings =
    ignore:.*argument 'device' of Tensor.pin_memory.*:DeprecationWarning
    ignore:.*argument 'device' of Tensor.is_pinned.*:DeprecationWarning
