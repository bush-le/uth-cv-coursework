# DINO ViT (dinoViT) Baseline Benchmark, Hard-Sample Mining & Fine-Tuning Configuration
model:
  name: "deepfake_image_detector"
  spatial_backbone: "dinov2_small" # Official Meta DINOv2 Vision Transformer (384-dim)
  pretrained_backbone: true
  embed_dim: 384
  patch_size: 16
  depth: 4
  num_heads: 4
  num_classes: 1
  dropout: 0.3

hard_sample_mining:
  bypass_threshold: 0.50 # Synthetic DF samples with P(fake) < 0.50 bypass baseline -> Hard Samples
  save_hard_manifest: "data/processed/hard_samples_manifest.jsonl"
  save_annotated_manifest: "data/processed/annotated_synthetic_manifest.jsonl"

finetuning:
  num_epochs: 15
  learning_rate: 0.0002
  weight_decay: 0.00001
  batch_size: 16
  hard_sample_loss_weight: 2.0
  hard_sample_oversample_factor: 2
  unfreeze_last_n_blocks: 2
  clip_grad_norm: 1.0
  device: "cuda"
  use_amp: true

loss:
  name: "weighted_binary_cross_entropy"
  label_smoothing: 0.05

evaluation:
  metrics:
    - "accuracy"
    - "roc_auc"
    - "f1_score"
    - "precision"
    - "recall"
    - "bypass_rate"
    - "hard_sample_recall"
  save_best_metric: "roc_auc"
