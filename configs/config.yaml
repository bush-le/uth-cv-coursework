# ==============================================================================
# Master Configuration (configs/config.yaml)
# Centralized configuration for Stable Diffusion Synthetic DF + dinoViT Hard-Sample Mining
# ==============================================================================

defaults:
  - dataset: deepfake_image
  - generation: stable_diffusion
  - detection: detector_baseline
  - _self_

project:
  name: "uth-cv-coursework"
  description: "Stable Diffusion Deepfake Generation, dinoViT Baseline & Hard-Sample Fine-Tuning"
  version: "0.2.0"
  seed: 42
  device: "cuda" # "cuda" or "cpu"

training:
  seed: 42
  device: "cuda"
  epochs: 15
  batch_size: 16
  num_workers: 2
  pin_memory: true
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  hard_sample_loss_weight: 2.0
  hard_sample_oversample_factor: 2
  unfreeze_last_n_blocks: 2
  mixed_precision: true # torch.cuda.amp.autocast
  deterministic: true

paths:
  data_dir: "data"
  raw_data: "data/01_raw_faces"
  synthetic_data: "data/02_synthetic_sd"
  hard_samples_data: "data/03_hard_samples"
  benchmarks_dir: "data/04_benchmarks"
  samples_dir: "data/samples"
  baseline_manifest: "data/01_raw_faces/raw_faces_manifest.jsonl"
  synthetic_manifest: "data/02_synthetic_sd/manifests/curated_synthetic.jsonl"
  hard_samples_manifest: "data/03_hard_samples/hard_samples_manifest.jsonl"
  sample_manifest: "data/samples/sample_manifest.jsonl"
  checkpoints_dir: "experiments/checkpoints"
  logs_dir: "experiments/logs"
  predictions_dir: "experiments/predictions"
  runs_dir: "experiments/runs"
