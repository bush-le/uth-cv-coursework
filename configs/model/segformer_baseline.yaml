# Model Configuration: SegFormer-B0 Baseline for Facial Occlusion Segmentation
model_name: "segformer_b0_occlusion"
architecture: "segformer"
backbone: "nvidia/mit-b0"
pretrained: true

# Input & Output Dimensions
in_channels: 3
num_classes: 6
image_size: [512, 512]

# Loss Configuration
loss:
  type: "composite_ce_dice"
  ce_weight: 1.0
  dice_weight: 1.0
  ignore_index: 255
  class_weights: [0.1, 1.2, 1.8, 1.5, 1.4, 1.5]  # Boost small occlusion accessories

# Optimization Parameters
optimizer:
  type: "AdamW"
  lr: 0.00006
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  type: "CosineAnnealingLR"
  T_max: 40
  eta_min: 0.000001
  warmup_epochs: 5

# Training Hyperparameters
training:
  epochs: 40
  batch_size: 8
  gradient_accumulation_steps: 2
  amp_enabled: true
  early_stopping_patience: 8
  metric_for_best_model: "val_miou"
