# ==============================================================================
# Model Configuration Template (configs/model/template.yaml)
# ==============================================================================

architecture: "custom_cnn" # e.g. resnet50, mobilenetv3, custom_cnn, yolo
pretrained: false
num_classes: 10
input_channels: 3
dropout_rate: 0.2

optimizer:
  name: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler:
  name: "cosine_annealing"
  t_max: 50
  min_lr: 1.0e-6

loss:
  name: "cross_entropy"
  label_smoothing: 0.1
