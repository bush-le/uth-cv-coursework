# Model Configuration: Deep U-Net Baseline for Facial De-occlusion
model_name: "unet_deocclusion_baseline"
architecture: "deocclusion_unet"
backbone: "resnet34"
pretrained: true

# Input & Output Dimensions
in_channels: 4 # 3 channels RGB occluded image + 1 channel binary mask
out_channels: 3 # 3 channels RGB restored portrait
image_size: [512, 512]

# Loss Configuration
loss:
  type: "composite_deocclusion_loss"
  lambda_hole: 6.0
  lambda_valid: 1.0
  lambda_perceptual: 0.1
  lambda_style: 120.0
  lambda_identity: 0.5
  arcface_model_path: "weights/arcface_ir50.pth"

# Optimization Parameters
optimizer:
  type: "AdamW"
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "CosineAnnealingLR"
  T_max: 50
  eta_min: 0.000001
  warmup_epochs: 5

# Training Hyperparameters
training:
  epochs: 50
  batch_size: 8
  gradient_accumulation_steps: 2
  amp_enabled: true
  early_stopping_patience: 10
  metric_for_best_model: "val_psnr"
