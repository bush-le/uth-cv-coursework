# Dataset Configuration: 2D Deepfake Image & Hard-Sample Dataset
name: "deepfake_image_dataset"
dataset_dir: "data/04_benchmarks"
raw_dir: "data/01_raw_faces"
baseline_manifest_path: "data/01_raw_faces/raw_faces_manifest.jsonl"
synthetic_manifest_path: "data/02_synthetic_sd/manifests/curated_synthetic.jsonl"
hard_samples_manifest_path: "data/03_hard_samples/hard_samples_manifest.jsonl"
benchmarks_dir: "data/04_benchmarks"
sample_manifest_path: "data/samples/sample_manifest.jsonl"

image:
  size: [256, 256] # [H, W]
  channels: 3
  color_space: "RGB"
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  identity_disjoint: true
  hard_sample_oversample_factor: 2
  seed: 42

loader:
  batch_size: 16
  num_workers: 2
  pin_memory: true
  drop_last: false

labels:
  0: "real"
  1: "fake"

data_sources:
  - "baseline"
  - "synthetic"
  - "hard_sample"

manipulations:
  - "sd_text2img"
  - "sd_inpaint"
  - "sd_img2img"
