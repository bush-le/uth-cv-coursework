# ==============================================================================
# Dataset Configuration (configs/dataset/default.yaml)
# ==============================================================================

name: "default_dataset"
root_dir: "data/raw"
processed_dir: "data/processed"
image_size: [224, 224] # [H, W]
channels: 3
num_classes: 10

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  shuffle: true
  seed: 42

augmentation:
  horizontal_flip_prob: 0.5
  random_crop: true
  color_jitter: false
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
