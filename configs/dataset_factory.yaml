# ==============================================================================
# Centralized Dataset Factory & Adversarial Hard-Sample Mining Configuration
# Single Source of Truth for Topic 11 (Zero-Hardcode Contract)
# ==============================================================================

seed: 42

paths:
  raw_manifest: "data/raw/manifest.jsonl"
  synthetic_dir: "data/synthetic"
  fake_manifest: "data/synthetic/fake_manifest.jsonl"
  curated_manifest: "data/synthetic/curated_manifest.jsonl"
  curation_report: "data/synthetic/curation_report.jsonl"
  hard_dir: "data/hard_samples"
  hard_manifest: "data/hard_samples/hard_samples_manifest.jsonl"
  annotated_manifest: "data/synthetic/annotated_synthetic_manifest.jsonl"
  benchmarks_dir: "data/benchmarks"
  stats_file: "data/dataset_statistics.json"
  gallery_image: "experiments/predictions/real_vs_synthetic_gallery.png"

generation:
  model_id: "runwayml/stable-diffusion-v1-5"
  inpaint_model_id: "stable-diffusion-v1-5/stable-diffusion-inpainting"
  modes:
    - "sd_img2img"
    - "sd_inpaint"
    - "sd_text2img"
  num_per_real: 1
  max_real_samples: 150
  steps: 25
  guidance_scale: 7.5
  img2img_strength: 0.42
  image_size:
    - 512
    - 512
  negative_prompt: "(deformed, distorted, disfigured:1.3), bad anatomy, poorly drawn face, blurry, plastic, artificial, mannequin, fake, cartoon, 3d render, mirror, frame, border, vignette, circular frame, porthole, multiple faces, distant face, small face, miniature face, wide shot, full body, torso, out of frame, cropped face, bad eyes, distorted pupils"
  inpaint_mask_box:
    - 0.30
    - 0.25
    - 0.70
    - 0.75

curation:
  reference_quantile_sharpness: 0.05
  clip:
    enabled: false
    model_id: "openai/clip-vit-base-patch32"
    min_score: 0.20
  face_check:
    backend: "opencv_haar"
  dedup: true

hardness:
  method: "real_manifold"
  backbone_id: "facebook/dinov2-small"
  k_neighbors: 5
  reference_quantile: 0.50
  detector_checkpoint: "experiments/checkpoints/baseline_detector_best.pt"
  detector_tau: 0.50
  batch_size: 16
  max_real_reference: 150

benchmarks:
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  stages:
    - name: "D0_baseline"
      train_sources:
        - "baseline"
      oversample_hard: 1
    - name: "D1_augmented"
      train_sources:
        - "baseline"
        - "synthetic"
      oversample_hard: 1
    - name: "D2_hard_boosted"
      train_sources:
        - "baseline"
        - "synthetic"
        - "hard_sample"
      oversample_hard: 2
